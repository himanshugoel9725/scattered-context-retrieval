# =============================================================
# Experiment Parameters
# =============================================================

global:
  random_seed: 42
  seeds: [42, 123, 456]  # Multiple seeds for variance estimation
  cache_dir: ".diskcache"
  results_dir: "results"
  log_level: "INFO"

# --- Phase 1: Problem Quantification ---
phase1:
  exp1_1_scatter_factor:
    description: "Quantify how scattered entity info is across domains"
    entities_per_domain: 40  # narrative: 40, legal: 30, scientific: 30 = 100
    domains: [narrative, legal, scientific]
    output_figures: [fig1_scatter_distribution, fig2_completeness_curves]

  exp1_2_rag_failure:
    description: "Show standard RAG fails on scattered queries"
    total_queries: 500
    localized_queries: 250
    scattered_queries: 250
    baselines:
      - bm25_top5
      - dense_e5_top5
      - dense_minilm_top5
      - hybrid_top5
    long_context_models: [gpt-4o, claude-3-5-sonnet]
    output_figures: [fig3_performance_gap, fig4_scatter_vs_quality]

  exp1_3_completeness_audit:
    description: "Measure retrieval completeness against gold chunks"
    queries: 200
    k_values: [5, 10, 20]
    output_figures: [fig5_completeness_at_k]

# --- Phase 2: System Experiments ---
phase2:
  exp2_1_strategy_comparison:
    description: "Compare 5 retrieval strategies on 4 core datasets"
    strategies: [standard_semantic, entity_expanded, entity_first, iterative, hybrid_entity]
    datasets: [quality, cuad, qasper, scatterqa]
    queries_per_dataset: 200
    retrieval_k: 15
    generation_model: "gpt-4o-mini"
    output_figures: [fig6_retrieval_completeness, fig7_ics_main_result, fig8_quality_vs_latency]

  exp2_2_ablation:
    description: "Ablation study — remove one component at a time"
    dataset: scatterqa
    queries: 200
    ablations:
      - full_system
      - minus_entity_index
      - minus_coref
      - minus_positional_diversity
      - minus_synthesis_prompt
      - minus_query_entity_detection
    output_figures: [fig9_ablation_waterfall]

  exp2_3_chunk_count:
    description: "How many chunks needed for complete entity descriptions?"
    strategy: hybrid_entity
    k_values: [1, 3, 5, 7, 10, 15, 20, 30]
    scatter_factor_bins: [low, medium, high]
    output_figures: [fig10_ics_vs_k]

  exp2_4_llm_comparison:
    description: "Different LLMs on same retrieved chunks"
    strategy: hybrid_entity
    retrieval_k: 10
    queries: 50
    models: [gpt4o, gpt4o_mini, claude_sonnet, gemini_pro, llama3_70b, llama3_8b]
    output_figures: [fig11_llm_comparison]

  exp2_5_ordering:
    description: "Does chunk ordering matter?"
    orderings: [chronological, reverse_chronological, relevance_ranked, entity_clustered, random]
    domains: [narrative, legal]
    queries_per_domain: 50
    random_repeats: 3
    output_figures: [fig12_ordering_comparison]

# --- Phase 3: Deep Analysis ---
phase3:
  exp3_1_scatter_taxonomy:
    description: "Categorize scatter types and per-category performance"
    queries: 100
    output_figures: [figure_scatter_taxonomy]
    categories:
      - progressive_accumulation
      - distributed_attributes
      - contradictory_evolution
      - cross_reference
      - implicit_scatter

  exp3_2_cross_domain:
    description: "Domain transfer of entity detection"
    output_figures: [figure_cross_domain_transfer]
    pairs:
      - {train: narrative, test: legal}
      - {train: legal, test: scientific}
      - {train: narrative, test: scientific}

  exp3_3_error_analysis:
    description: "Categorize failure modes"
    sample_size: 50
    output_figures: [figure_error_analysis]
    error_types:
      - entity_detection_failure
      - coreference_failure
      - over_retrieval
      - under_retrieval
      - synthesis_failure
      - conflicting_information

  exp3_4_long_context:
    description: "Scatter-aware RAG vs full-document LLM"
    max_doc_tokens: 128000
    output_figures: [fig13_quality_vs_cost]

# --- ScatterQA Benchmark ---
scatterqa:
  novels: 50
  entities_per_novel: 10
  question_types: [appearance, background, personality, relationships, arc]
  total_qa_pairs: 2500
  iaa_sample_fraction: 0.10
  iaa_thresholds:
    entity_mentions_kappa: 0.6
    paragraph_relevance_kappa: 0.6
    attribute_label_kappa: 0.5
